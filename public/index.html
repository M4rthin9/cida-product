<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</title>
  <meta name="description" content="แคตตาล็อกผลิตภัณฑ์ ทัณฑสถานบำบัดพิเศษกลาง ทัณฑสถานหญิงกลาง และเรือนจำพิเศษธนบุรี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="hero">
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="container hero-inner">
      <span class="hero-eyebrow">Correctional Department</span>
      <h1 class="hero-title">แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</h1>
      <p class="hero-sub">ผลิตภัณฑ์จากเรือนจำและทัณฑสถาน</p>
      <div class="hero-line"></div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="ค้นหาและกรองสินค้า">
      <div class="search-box">
        <input type="search" id="search" placeholder="ค้นหาชื่อสินค้า…" autocomplete="off">
        <span class="search-icon">&#8594;</span>
      </div>
      <div class="company-filter">
        <span class="filter-label">แหล่งที่มา</span>
        <div class="company-chips" id="companyChips" role="group" aria-label="กรองตามแหล่งที่มา"></div>
      </div>
      <span class="result-count" id="resultCount"></span>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="empty hidden" id="empty">
      <p>ไม่พบสินค้าที่ตรงกับการค้นหา</p>
    </div>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="ปิด">&#10005;</button>
      <div class="modal-head">
        <span class="badge" id="modalCompanyShort"></span>
        <span class="modal-id" id="modalId"></span>
      </div>
      <div class="modal-img">
        <img id="modalImage" alt="">
      </div>
      <h2 id="modalName"></h2>
      <div class="modal-price" id="modalPrice"></div>
      <dl class="modal-details">
        <div><dt>ขนาด</dt><dd id="modalDim"></dd></div>
        <div><dt>น้ำหนัก</dt><dd id="modalWeight"></dd></div>
        <div><dt>รหัส EAN-13</dt><dd id="modalBarcode"></dd></div>
      </dl>
      <p class="modal-note" id="modalNote"></p>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-line"></div>
    <div class="container footer-inner">
      <span class="footer-text">จัดทำโดย ทัณฑสถานบำบัดพิเศษกลาง</span>
      <span class="footer-sub">ฝ่ายฝึกวิชาชีพผู้ต้องขัง · ส่วนพัฒนาผู้ต้องขัง</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
