<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</title>
  <meta name="description" content="แคตตาล็อกผลิตภัณฑ์ ทัณฑสถานบำบัดพิเศษกลาง ทัณฑสถานหญิงกลาง และเรือนจำพิเศษธนบุรี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="hero">
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="container hero-inner">
      <span class="hero-eyebrow">Correctional Department</span>
      <h1 class="hero-title">แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</h1>
      <p class="hero-sub">ผลิตภัณฑ์จากเรือนจำและทัณฑสถาน</p>
      <div class="hero-ornament" aria-hidden="true">
        <svg viewBox="0 0 120 24" width="120" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 2 C64 8, 72 10, 60 22 C48 10, 56 8, 60 2Z" fill="#c9a84c" opacity=".6"/>
          <path d="M60 6 C63 10, 68 11, 60 18 C52 11, 57 10, 60 6Z" fill="#c9a84c" opacity=".35"/>
          <line x1="0" y1="12" x2="45" y2="12" stroke="#c9a84c" opacity=".3" stroke-width=".5"/>
          <line x1="75" y1="12" x2="120" y2="12" stroke="#c9a84c" opacity=".3" stroke-width=".5"/>
          <circle cx="48" cy="12" r="1.5" fill="#c9a84c" opacity=".4"/>
          <circle cx="72" cy="12" r="1.5" fill="#c9a84c" opacity=".4"/>
        </svg>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="ค้นหาและกรองสินค้า">
      <div class="search-box">
        <input type="search" id="search" placeholder="ค้นหาชื่อสินค้า…" autocomplete="off">
        <span class="search-icon">&#8594;</span>
      </div>
      <div class="company-filter">
        <div class="company-chips" id="companyChips" role="group" aria-label="กรองตามแหล่งที่มา"></div>
        <span class="chip-all" id="chipAll">ทั้งหมด</span>
      </div>
      <span class="result-count" id="resultCount"></span>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="empty hidden" id="empty">
      <p>ไม่พบสินค้าที่ตรงกับการค้นหา</p>
    </div>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="ปิด">&#10005;</button>
      <div class="modal-head">
        <span class="badge" id="modalCompanyShort"></span>
        <span class="modal-id" id="modalId"></span>
      </div>
      <div class="modal-img">
        <img id="modalImage" alt="">
      </div>
      <h2 id="modalName"></h2>
      <div class="modal-price" id="modalPrice"></div>
      <dl class="modal-details">
        <div><dt>ขนาด</dt><dd id="modalDim"></dd></div>
        <div><dt>น้ำหนัก</dt><dd id="modalWeight"></dd></div>
      </dl>
      <p class="modal-note" id="modalNote"></p>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-ornament" aria-hidden="true">
      <svg viewBox="0 0 60 12" width="60" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 1 C32 4, 36 5, 30 11 C24 5, 28 4, 30 1Z" fill="#c9a84c" opacity=".4"/>
        <line x1="0" y1="6" x2="25" y2="6" stroke="#c9a84c" opacity=".25" stroke-width=".5"/>
        <line x1="35" y1="6" x2="60" y2="6" stroke="#c9a84c" opacity=".25" stroke-width=".5"/>
      </svg>
    </div>
    <div class="container footer-inner">
      <span class="footer-text">จัดทำโดย ทัณฑสถานบำบัดพิเศษกลาง</span>
      <span class="footer-sub">ฝ่ายฝึกวิชาชีพผู้ต้องขัง · ส่วนพัฒนาผู้ต้องขัง</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
