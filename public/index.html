<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</title>
  <meta name="description" content="แคตตาล็อกผลิตภัณฑ์ ทัณฑสถานบำบัดพิเศษกลาง และ ทัณฑสถานหญิงกลาง">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
          <rect x="2" y="7" width="28" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M2 13 h28 M22 7 v6" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="brand-text">
          <strong>แคตตาล็อกผลิตภัณฑ์ราชทัณฑ์</strong>
          <small>ผลิตภัณฑ์จากเรือนจำและทัณฑสถาน</small>
        </span>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="ค้นหาและกรองสินค้า">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16 16 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search" placeholder="ค้นหาชื่อสินค้า…" autocomplete="off">
      </div>
      <label class="filter-box">
        <span>แหล่งที่มา</span>
        <select id="companyFilter">
          <option value="all">ทั้งหมด</option>
        </select>
      </label>
      <span class="result-count" id="resultCount"></span>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="empty hidden" id="empty">
      <p>ไม่พบสินค้าที่ตรงกับการค้นหา</p>
    </div>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="ปิด">✕</button>
      <div class="modal-head">
        <span class="badge" id="modalCompanyShort"></span>
        <span class="modal-id" id="modalId"></span>
      </div>
      <div class="modal-img">
        <img id="modalImage" alt="">
      </div>
      <h2 id="modalName"></h2>
      <div class="modal-price" id="modalPrice"></div>
      <dl class="modal-details">
        <div><dt>ขนาด</dt><dd id="modalDim"></dd></div>
        <div><dt>น้ำหนัก</dt><dd id="modalWeight"></dd></div>
        <div><dt>รหัส EAN-13</dt><dd id="modalBarcode"></dd></div>
      </dl>
      <p class="modal-note" id="modalNote"></p>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      จัดทำโดย mัณฑสถานบำบัดพิเศษกลาง - ฝ่ายฝึกวิชาชีพผู้ต้องขัง ส่วนพัฒนาผู้ต้องขัง
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
